name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach, for example v0.1.0
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/third_party_notices.py

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout packaging files
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libasound2-dev

      - name: Install Rust toolchain
        working-directory: src/src/tui
        run: rustup toolchain install

      - name: Configure
        working-directory: src
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake --preset linux

      - name: Build
        working-directory: src
        run: cmake --build --preset linux

      - name: Test
        working-directory: src
        run: ctest --test-dir build/linux --output-on-failure

      - name: Package
        id: package
        run: |
          version="${TAG#v}"
          [ -n "$TAG" ] || version="dev-${GITHUB_SHA::7}"
          name="rt-audio-${version}-linux-x64"
          b=src/build/linux
          mkdir "$name"
          cp "$b/src/tui/rt_rig" "$b/src/app/rt_audio" \
             "$b/tools/offline_render/offline_render" \
             "$b/tools/loopback_latency/loopback_latency" "$name/"
          strip "$name"/*
          cp src/README.md ci/LICENSE "$name/"
          python3 ci/.github/scripts/third_party_notices.py src/src/tui "$name"
          tar -czf "$name.tar.gz" "$name"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout packaging files
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src

      - name: Install Ninja
        run: choco install ninja -y

      - name: Add LLVM to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin" -Encoding utf8

      - name: Install Rust toolchain
        working-directory: src/src/tui
        run: rustup toolchain install

      - name: Configure
        working-directory: src
        run: cmake --preset windows-clang-cl

      - name: Build
        working-directory: src
        run: cmake --build --preset windows-clang-cl

      - name: Test
        working-directory: src
        run: ctest --test-dir build/windows-clang --output-on-failure

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = if ($env:TAG) { $env:TAG.TrimStart('v') } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $name = "rt-audio-$version-windows-x64"
          $b = 'src/build/windows-clang'
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item -Destination $name -Path "$b/src/tui/rt_rig.exe", "$b/src/app/rt_audio.exe",
              "$b/tools/offline_render/offline_render.exe",
              "$b/tools/loopback_latency/loopback_latency.exe", 'src/README.md', 'ci/LICENSE'
          python ci/.github/scripts/third_party_notices.py src/src/tui $name
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "archive=$name.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  windows-asio:
    name: Windows x64 + ASIO (GPLv3)
    runs-on: windows-2022
    steps:
      - name: Checkout packaging files
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src

      - name: Install Ninja
        run: choco install ninja -y

      - name: Add LLVM to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin" -Encoding utf8

      - name: Install Rust toolchain
        working-directory: src/src/tui
        run: rustup toolchain install

      - name: Configure
        working-directory: src
        run: cmake --preset windows-clang-cl-asio

      - name: Build
        working-directory: src
        run: cmake --build --preset windows-clang-cl-asio

      - name: Test
        working-directory: src
        run: ctest --test-dir build/windows-clang-asio --output-on-failure

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = if ($env:TAG) { $env:TAG.TrimStart('v') } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $ref = if ($env:TAG) { $env:TAG } else { $env:GITHUB_SHA }
          $name = "rt-audio-$version-windows-x64-asio"
          $b = 'src/build/windows-clang-asio'
          $sdk = "$b/_deps/asiosdk-2.3.4/ASIOSDK"
          New-Item -ItemType Directory -Path $name, "$name/source/asiosdk/common" | Out-Null
          Copy-Item -Destination $name -Path "$b/src/tui/rt_rig.exe", "$b/src/app/rt_audio.exe",
              "$b/tools/offline_render/offline_render.exe",
              "$b/tools/loopback_latency/loopback_latency.exe", 'src/README.md', 'ci/LICENSE',
              'ci/assets/asio-compatible.svg'
          Copy-Item -Path 'ci/packaging/GPL-3.0.txt' -Destination "$name/COPYING"
          Copy-Item -Path "$sdk/common/asio.h", "$sdk/common/asiosys.h", "$sdk/common/iasiodrv.h" `
              -Destination "$name/source/asiosdk/common"
          Copy-Item -Path "$sdk/LICENSE.txt" -Destination "$name/source/asiosdk/LICENSE.txt"
          @"
          rt-audio $version for Windows, with the ASIO® backend

          This package as a whole is distributed under the GNU General Public License version 3
          (see COPYING). It contains code built from the Steinberg ASIO SDK 2.3.4, used under GPLv3
          (see source/asiosdk/LICENSE.txt). The SDK files used by this build are in source/asiosdk/.
          The rest of the source is the rt-audio repository at $ref:
          https://github.com/$env:GITHUB_REPOSITORY/tree/$ref (MIT, see LICENSE).

          ASIO is a registered trademark of Steinberg Media Technologies GmbH.
          "@ | Out-File -FilePath "$name/ASIO-NOTICE.txt" -Encoding utf8
          python ci/.github/scripts/third_party_notices.py src/src/tui $name
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $required = 'rt_rig.exe', 'rt_audio.exe', 'offline_render.exe', 'loopback_latency.exe',
              'README.md', 'LICENSE', 'COPYING', 'ASIO-NOTICE.txt', 'asio-compatible.svg',
              'source/asiosdk/LICENSE.txt', 'source/asiosdk/common/asio.h',
              'source/asiosdk/common/asiosys.h', 'source/asiosdk/common/iasiodrv.h'
          foreach ($f in $required) {
              if (-not (Test-Path "$name/$f")) { Write-Error "missing $f"; exit 1 }
          }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "archive=$name.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-asio
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: [linux, windows, windows-asio]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "rt-audio ${TAG#v}" --generate-notes
          gh release upload "$TAG" dist/* --clobber
