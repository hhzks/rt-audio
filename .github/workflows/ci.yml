name: CI

on:
  push:
    branches: [main, mingw]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux / GCC 16.2 (C++26)
    runs-on: ubuntu-24.04
    container: gcc:16.2.0
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build libasound2-dev

      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          cmake --version
          g++ --version

      - name: Install Rust toolchain
        working-directory: src/tui
        run: rustup toolchain install

      - name: Configure
        env:
          CXX: g++
        run: cmake --preset linux

      - name: Build
        run: cmake --build --preset linux

      - name: Test
        run: ctest --test-dir build/linux --output-on-failure

      - name: Rust format
        working-directory: src/tui
        run: cargo fmt --check

      - name: Rust lint
        working-directory: src/tui
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Layering guard
        run: cmake --build build/linux --target check_layering

  windows:
    name: Windows / MinGW GCC 16 (C++26)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Put MinGW first on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" -Encoding utf8

      - name: Toolchain versions
        run: |
          cmake --version
          g++ --version

      - name: Install Rust toolchain
        working-directory: src/tui
        run: rustup toolchain install

      - name: Configure
        run: cmake --preset windows-mingw

      - name: Build
        run: cmake --build --preset windows-mingw

      - name: Test
        run: ctest --test-dir build/windows-mingw --output-on-failure

      - name: Rust format
        working-directory: src/tui
        run: cargo fmt --check

      - name: Rust lint
        working-directory: src/tui
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Layering guard
        run: cmake --build build/windows-mingw --target check_layering

  windows-asio:
    name: Windows / MinGW GCC 16 + ASIO (GPLv3 build)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Put MinGW first on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" -Encoding utf8

      - name: Install Rust toolchain
        working-directory: src/tui
        run: rustup toolchain install

      - name: Cache the ASIO SDK
        uses: actions/cache@v4
        with:
          path: build/windows-mingw-asio/_deps/asiosdk-2.3.4
          key: asio-sdk-${{ hashFiles('cmake/AsioSdk.cmake') }}

      - name: Configure
        run: cmake --preset windows-mingw-asio

      - name: Build
        run: cmake --build --preset windows-mingw-asio

      - name: Test
        run: ctest --test-dir build/windows-mingw-asio --output-on-failure
