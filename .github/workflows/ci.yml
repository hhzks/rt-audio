name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux / GCC 14 (C++26)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libasound2-dev

      - name: Toolchain versions
        run: |
          cmake --version
          g++-14 --version

      - name: Install Rust toolchain
        working-directory: src/tui
        run: rustup toolchain install

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake --preset linux

      - name: Build
        run: cmake --build --preset linux

      - name: Test
        run: ctest --test-dir build/linux --output-on-failure

      - name: Rust format
        working-directory: src/tui
        run: cargo fmt --check

      - name: Rust lint
        working-directory: src/tui
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Layering guard
        run: cmake --build build/linux --target check_layering

  windows:
    name: Windows / clang-cl (C++26)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y

      - name: Add LLVM to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin" -Encoding utf8

      - name: Toolchain versions
        run: |
          cmake --version
          clang-cl --version

      - name: Install Rust toolchain
        working-directory: src/tui
        run: rustup toolchain install

      - name: Configure
        run: cmake --preset windows-clang-cl

      - name: Build
        run: cmake --build --preset windows-clang-cl

      - name: Test
        run: ctest --test-dir build/windows-clang --output-on-failure

      - name: Rust format
        working-directory: src/tui
        run: cargo fmt --check

      - name: Rust lint
        working-directory: src/tui
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Layering guard
        run: cmake --build build/windows-clang --target check_layering

  windows-asio:
    name: Windows / clang-cl + ASIO (GPLv3 build)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y

      - name: Add LLVM to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin" -Encoding utf8

      - name: Install Rust toolchain
        working-directory: src/tui
        run: rustup toolchain install

      - name: Configure
        run: cmake --preset windows-clang-cl-asio

      - name: Build
        run: cmake --build --preset windows-clang-cl-asio

      - name: Test
        run: ctest --test-dir build/windows-clang-asio --output-on-failure
